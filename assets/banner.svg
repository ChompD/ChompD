<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Dexter Toribio, Full-Stack Developer, open to internships">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.88" cy="0" r="0.6">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="260" rx="18" fill="#0b0d12"/>
  <rect width="1000" height="260" rx="18" fill="url(#glow1)"/>
  <rect width="1000" height="260" rx="18" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="999" height="259" rx="17.5" fill="none" stroke="#232a36"/>

  <text x="48" y="62" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="17" fill="#98a2b3"><tspan fill="#2dd4bf">~/dexter</tspan> $ whoami</text>

  <text x="46" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#e8ebf1">Dexter Toribio</text>

  <text x="48" y="172" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="url(#g)">Full-Stack Developer</text>
  <rect x="340" y="150" width="14" height="27" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(48 200)">
    <rect width="196" height="34" rx="17" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.35"/>
    <circle cx="20" cy="17" r="5" fill="#34d399"/>
    <text x="34" y="22.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34d399">Open to internships</text>
  </g>

  <!-- code card -->
  <g transform="translate(600 46)">
    <rect width="352" height="170" rx="12" fill="#12161e" stroke="#232a36"/>
    <line x1="0" y1="34" x2="352" y2="34" stroke="#232a36"/>
    <circle cx="18" cy="17" r="5" fill="#ff6b6b"/>
    <circle cx="34" cy="17" r="5" fill="#ffd166"/>
    <circle cx="50" cy="17" r="5" fill="#34d399"/>
    <text x="66" y="21.5" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#6b7586">dexter.ts</text>
    <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#e8ebf1">
      <text x="18" y="60"><tspan fill="#c4a7ff">const</tspan> <tspan fill="#7c9cff">dexter</tspan> = {</text>
      <text x="34" y="82">school: <tspan fill="#a5e3a0">"Holy Angel University"</tspan>,</text>
      <text x="34" y="104">stack: [<tspan fill="#a5e3a0">"React"</tspan>, <tspan fill="#a5e3a0">"Node"</tspan>, <tspan fill="#a5e3a0">"Postgres"</tspan>],</text>
      <text x="34" y="126">ml: [<tspan fill="#a5e3a0">"YOLOv8"</tspan>, <tspan fill="#a5e3a0">"scikit-learn"</tspan>],</text>
      <text x="34" y="148">openTo: <tspan fill="#a5e3a0">"internships"</tspan>,</text>
      <text x="18" y="164">};</text>
    </g>
  </g>
</svg>
