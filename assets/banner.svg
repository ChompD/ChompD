<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Dexter Toribio, Full-Stack Developer">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.88" cy="0" r="0.6">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="210" rx="18" fill="#0b0d12"/>
  <rect width="1000" height="210" rx="18" fill="url(#glow1)"/>
  <rect width="1000" height="210" rx="18" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="999" height="209" rx="17.5" fill="none" stroke="#232a36"/>

  <text x="48" y="62" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="17" fill="#98a2b3"><tspan fill="#2dd4bf">~/dexter</tspan> $ whoami</text>

  <text x="46" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#e8ebf1">Dexter Toribio</text>

  <text x="48" y="172" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="url(#g)">Full-Stack Developer</text>
  <rect x="316" y="150" width="14" height="27" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>


</svg>
